services:
  api:
    build: ./apps/api-java
    image: yahaha-java-api:local
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      API_PORT: 8080
      MYSQL_URL: jdbc:mysql://mysql:3306/yahaha?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      MYSQL_USER: yahaha
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yahaha}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: yahaha
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-yahaha}
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: yahaha-games
      MINIO_PUBLIC_BASE_URL: http://localhost:9000/yahaha-games
      WEB_ORIGIN: http://localhost:1314
      AI_CONFIG_SECRET: ${AI_CONFIG_SECRET:-local-dev-key-change-before-public-use-32}
      LLM_ALLOW_PRIVATE_ENDPOINTS: ${LLM_ALLOW_PRIVATE_ENDPOINTS:-false}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      api: {condition: service_healthy}
    ports: ["1314:1314"]

  # Local stand-in for a real AI provider; started only with `--profile test`
  # and requires LLM_ALLOW_PRIVATE_ENDPOINTS=true for the API to accept it.
  mock-llm:
    image: python:3.12-alpine
    profiles: ["test"]
    volumes:
      - ./scripts/mock_llm.py:/mock_llm.py:ro
    command: ["python", "/mock_llm.py"]
    ports: ["127.0.0.1:${MOCK_LLM_HOST_PORT:-8090}:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yahaha
      MYSQL_USER: yahaha
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yahaha}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-change-me}
    ports: ["127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u yahaha -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: yahaha
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-yahaha}
    ports: ["127.0.0.1:${RABBITMQ_HOST_PORT:-5673}:5672", "127.0.0.1:${RABBITMQ_CONSOLE_PORT:-15673}:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
  rabbitmq_data:
  minio_data:
