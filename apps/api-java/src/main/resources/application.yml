server:
  port: ${API_PORT:8080}
spring:
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/gameweare?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:gameweare}
    password: ${MYSQL_PASSWORD:gameweare}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:gameweare}
    password: ${RABBITMQ_PASSWORD:gameweare}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 2s
          multiplier: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
gameweare:
  agent:
    engine: ${AGENT_ENGINE:legacy}
    worker-concurrency: ${AGENT_WORKER_CONCURRENCY:2}
    stall-timeout-minutes: ${AGENT_STALL_TIMEOUT_MINUTES:25}
    filesystem: ${AGENT_FILESYSTEM:kubernetes}
    docker:
      image: ${AGENT_DOCKER_IMAGE:public.ecr.aws/docker/library/python:3.12-alpine}
    kubernetes:
      namespace: ${AGENT_SANDBOX_NAMESPACE:create-runners}
      warm-pool: ${AGENT_SANDBOX_WARM_POOL:gameweare-create}
  web-origin: ${WEB_ORIGIN:http://localhost:1314}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:gameweare-games}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000/gameweare-games}
  outbox:
    interval-ms: 1000
  llm:
    allow-private-endpoints: ${LLM_ALLOW_PRIVATE_ENDPOINTS:false}
    allowed-hosts: ${LLM_ALLOWED_HOSTS:}
  official-llm:
    base-url: ${OFFICIAL_LLM_BASE_URL:}
    model: ${OFFICIAL_LLM_MODEL:}
    api-key: ${OFFICIAL_LLM_API_KEY:}
  auth:
    token-ttl-seconds: ${TOKEN_TTL_SECONDS:604800}
